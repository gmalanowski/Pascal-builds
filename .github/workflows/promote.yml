name: Promote validated candidate

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project to promote
        required: true
        type: choice
        options:
          - comfyui
          - sunshine
      upstream_ref:
        description: Upstream release tag already built as candidate
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  promote-comfyui:
    if: inputs.project == 'comfyui'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare names
        id: meta
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$REF" | tr '/:@ ' '----')"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/comfyui-pascal"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote container tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:${SAFE_REF}-candidate"
          docker tag "$IMAGE:${SAFE_REF}-candidate" "$IMAGE:${SAFE_REF}"
          docker tag "$IMAGE:${SAFE_REF}-candidate" "$IMAGE:stable"
          docker push "$IMAGE:${SAFE_REF}"
          docker push "$IMAGE:stable"

      - name: Create stable release marker
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.upstream_ref }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          tag="comfyui-${SAFE_REF}-stable"
          title="ComfyUI $REF stable compatibility build"
          notes="Validated compatibility build. Container: \`$IMAGE:${SAFE_REF}\` (also tagged \`stable\`)."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes"
          fi

  promote-sunshine:
    if: inputs.project == 'sunshine'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare names
        id: meta
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$REF" | tr '/:@ ' '----')"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Download candidate package
        env:
          GH_TOKEN: ${{ github.token }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "sunshine-${SAFE_REF}-candidate" --dir artifacts

      - name: Publish stable package release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.upstream_ref }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          tag="sunshine-${SAFE_REF}-stable"
          title="Sunshine $REF stable compatibility build"
          notes="Validated Ubuntu 24.04/x86-64 compatibility package built from upstream Sunshine $REF with CUDA 12.6 for NVIDIA Pascal."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" \
              artifacts/* \
              --title "$title" \
              --notes "$notes"
          fi

      - name: Publish package to APT stable
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          pkg="$(find artifacts -maxdepth 1 -type f -name 'sunshine-ubuntu24-cuda12.6-pascal-x86_64.deb' -print -quit)"
          test -n "$pkg"
          test -s "$pkg"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          bash scripts/update-apt-repo.sh stable "$pkg"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apt
          if git diff --cached --quiet; then
            echo 'APT stable repository already up to date.'
            exit 0
          fi
          git commit -m "Promote Sunshine $REF to APT stable"

          # Main may move between checkout and publication.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

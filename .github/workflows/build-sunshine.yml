name: Build Sunshine compatibility package

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Sunshine release tag or commit
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare names
        id: meta
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$REF" | tr '/:@ ' '----')"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "marker=sunshine-${safe_ref}-candidate" >> "$GITHUB_OUTPUT"

      - name: Build Ubuntu 22.04 / CUDA 12.6 Pascal package
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker build \
            --build-arg SUNSHINE_REF="$REF" \
            --file sunshine/Dockerfile \
            --target artifact \
            --output type=local,dest=out \
            .

      - name: Verify package
        run: |
          set -euo pipefail
          pkg="out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb"
          test -s "$pkg"
          dpkg-deb --info "$pkg"
          sha256sum "$pkg" | tee out/SHA256SUMS

      - name: Create candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.meta.outputs.marker }}
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          gh release create "$MARKER" \
            out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb \
            out/SHA256SUMS \
            --title "Sunshine $REF Pascal/CUDA 12.6 candidate" \
            --notes "Automated Ubuntu 22.04/x86-64 compatibility candidate for Sunshine $REF.\n\nBuilt against CUDA 12.6.3 specifically to retain CUDA/NvFBC support for NVIDIA Pascal (compute capability 6.1), while keeping a generic x86-64 CPU baseline for older CPUs. Sunshine upstream includes Pascal CUDA architectures when the compiler is CUDA < 13.\n\nThis is a candidate build; validate NVIDIA capture/encoding on the target Pascal system before treating it as stable."

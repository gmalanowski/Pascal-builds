name: Build Sunshine compatibility package

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Sunshine release tag or commit
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare names
        id: meta
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$REF" | tr '/:@ ' '----')"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "marker=sunshine-${safe_ref}-candidate" >> "$GITHUB_OUTPUT"

      - name: Build Ubuntu 22.04 / CUDA 12.6 Pascal package
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker build \
            --build-arg SUNSHINE_REF="$REF" \
            --file sunshine/Dockerfile \
            --target artifact \
            --output type=local,dest=out \
            .

      - name: Normalize Debian package version
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          pkg="out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb"
          test -s "$pkg"

          # Patching Sunshine sources for compatibility makes upstream's git-based
          # version detector report 0.0.0-<sha>-dirty. For release tags, restore a
          # monotonic Debian version so installing a candidate is an upgrade rather
          # than an accidental downgrade.
          case "$REF" in
            v[0-9]*) deb_version="${REF#v}+pascal1" ;;
            *)       deb_version="0~git-${REF}+pascal1" ;;
          esac

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dpkg-deb -R "$pkg" "$work"
          sed -i "s/^Version:.*/Version: ${deb_version}/" "$work/DEBIAN/control"

          # dpkg-deb requires Debian maintainer scripts to be executable. Raw
          # extraction/repacking can leave these scripts at 0644, so normalize
          # only the standard executable maintainer hooks before rebuilding.
          for script in preinst postinst prerm postrm config; do
            if [ -f "$work/DEBIAN/$script" ]; then
              chmod 0755 "$work/DEBIAN/$script"
            fi
          done

          dpkg-deb -b "$work" "$pkg" >/dev/null
          echo "Normalized package version: $deb_version"

      - name: Verify package
        run: |
          set -euo pipefail
          pkg="out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb"
          test -s "$pkg"
          dpkg-deb --info "$pkg"
          sha256sum "$pkg" | tee out/SHA256SUMS

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.meta.outputs.marker }}
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          title="Sunshine $REF Pascal/CUDA 12.6 candidate"
          notes="Automated Ubuntu 22.04/x86-64 compatibility candidate for Sunshine $REF.\n\nBuilt against CUDA 12.6.3 specifically to retain CUDA/NvFBC support for NVIDIA Pascal (compute capability 6.1), while keeping a generic x86-64 CPU baseline for older CPUs. Sunshine upstream includes Pascal CUDA architectures when the compiler is CUDA < 13.\n\nThis is a candidate build; validate NVIDIA capture/encoding on the target Pascal system before treating it as stable."

          if gh release view "$MARKER" >/dev/null 2>&1; then
            echo "Candidate release already exists; replacing its assets."
            gh release upload "$MARKER" \
              out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb \
              out/SHA256SUMS \
              --clobber
            gh release edit "$MARKER" --title "$title" --notes "$notes"
          else
            gh release create "$MARKER" \
              out/sunshine-ubuntu22-cuda12.6-pascal-x86_64.deb \
              out/SHA256SUMS \
              --title "$title" \
              --notes "$notes"
          fi

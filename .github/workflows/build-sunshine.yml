name: Build Sunshine compatibility package

on:
  push:
    branches: [main]
    paths:
      - 'sunshine/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-sunshine.yml'
  pull_request:
    paths:
      - 'sunshine/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-sunshine.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Stable Sunshine release tag
        required: true
        type: string

concurrency:
  group: sunshine-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Run compatibility regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Resolve release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          if [ -z "$REF" ]; then
            REF="$(python3 scripts/latest-release.py LizardByte/Sunshine | jq -r .tag_name)"
          fi
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable Sunshine release tag'; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ubuntu ${{ matrix.ubuntu }} / CUDA 12.6 Pascal package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sunshine/Dockerfile
          target: artifact
          build-args: |
            SUNSHINE_REF=${{ needs.resolve.outputs.ref }}
            UBUNTU_VERSION=${{ matrix.ubuntu }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=sunshine-ubuntu${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=sunshine-ubuntu${{ matrix.ubuntu }}

      - name: Normalize and verify Debian package
        env:
          REF: ${{ needs.resolve.outputs.ref }}
          UBUNTU: ${{ matrix.ubuntu }}
        run: |
          set -euo pipefail
          pkg="out/sunshine-ubuntu${UBUNTU%%.*}-cuda12.6-pascal-x86_64.deb"
          mv out/Sunshine.deb "$pkg"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          dpkg-deb -R "$pkg" "$work"
          sed -i "s/^Version:.*/Version: ${REF#v}+pascal3/" "$work/DEBIAN/control"
          for script in preinst postinst prerm postrm config; do
            if [ -f "$work/DEBIAN/$script" ]; then chmod 0755 "$work/DEBIAN/$script"; fi
          done
          dpkg-deb -b "$work" "$pkg" >/dev/null
          dpkg-deb --info "$pkg"
          test "$(dpkg-deb -f "$pkg" Version)" = "${REF#v}+pascal3"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-ubuntu${{ matrix.ubuntu }}
          path: out/*.deb
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sunshine-ubuntu*
          merge-multiple: true
          path: out
      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          marker="sunshine-${REF}-candidate"
          title="Sunshine $REF Pascal/CUDA 12.6 candidate"
          (cd out && sha256sum *.deb) > out/SHA256SUMS
          cat > notes.md <<EOF
          Automated Ubuntu 24.04 and 26.04/x86-64 compatibility candidates for Sunshine $REF.

          Built with CUDA 12.6.3, GCC 13 and compute capability 6.1 for NVIDIA Pascal, with a generic x86-64 CPU baseline. Uses downstream compatibility patches.

          Validate capture/encoding on target hardware before manual stable promotion. Ubuntu 26.04 uses the separate testing-ubuntu26 APT suite; Ubuntu 24.04 retains testing.
          EOF
          if gh release view "$marker" >/dev/null 2>&1; then
            gh release upload "$marker" out/*.deb out/SHA256SUMS --clobber
            gh release edit "$marker" --title "$title" --notes-file notes.md
          else
            gh release create "$marker" out/*.deb out/SHA256SUMS --title "$title" --notes-file notes.md
          fi
      - name: Publish candidate to APT testing
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          bash scripts/update-apt-repo.sh testing out/sunshine-ubuntu24-cuda12.6-pascal-x86_64.deb
          bash scripts/update-apt-repo.sh testing-ubuntu26 out/sunshine-ubuntu26-cuda12.6-pascal-x86_64.deb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/sign-apt-repo.sh
          git add apt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Sunshine $REF to APT testing"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

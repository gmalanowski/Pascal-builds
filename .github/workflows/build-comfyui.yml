name: Build ComfyUI compatibility image

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ComfyUI release tag or commit
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare names
        id: meta
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          safe_ref="$(printf '%s' "$REF" | tr '/:@ ' '----')"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/comfyui-pascal"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "marker=comfyui-${safe_ref}-candidate" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        env:
          REF: ${{ inputs.upstream_ref }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg COMFYUI_REF="$REF" \
            --tag "$IMAGE:${SAFE_REF}-candidate" \
            --file comfyui/Dockerfile \
            .

      - name: Smoke test native imports
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE:${SAFE_REF}-candidate" - <<'PY'
          import sys
          import torch
          import kornia
          print('torch', torch.__version__)
          print('kornia', kornia.__version__)
          assert kornia.__version__.startswith('0.7.1')
          assert 'kornia_rs' not in sys.modules
          PY

      - name: Push candidate image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: docker push "$IMAGE:${SAFE_REF}-candidate"

      - name: Create or update candidate marker release
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.meta.outputs.marker }}
          REF: ${{ inputs.upstream_ref }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SAFE_REF: ${{ steps.meta.outputs.safe_ref }}
        run: |
          set -euo pipefail
          title="ComfyUI $REF candidate"
          notes="Automated compatibility candidate for ComfyUI $REF.\n\nContainer: \`$IMAGE:${SAFE_REF}-candidate\`\n\nTarget: NVIDIA Pascal-era GPUs with CUDA 12.6 and older x86-64 CPUs without an AVX2 requirement from Kornia.\n\nThis is a candidate build; validate it on target hardware before treating it as stable."

          if gh release view "$MARKER" >/dev/null 2>&1; then
            echo "Candidate release already exists; updating metadata."
            gh release edit "$MARKER" --title "$title" --notes "$notes"
          else
            gh release create "$MARKER" --title "$title" --notes "$notes"
          fi
